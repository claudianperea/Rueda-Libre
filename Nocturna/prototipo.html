<!DOCTYPE html>

<html lang="es">

<head> <meta charset="UTF-8"> <meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Rueda Nocturna</title>

<script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

</head>

<body class="bg-slate-950 text-white">

<main class="min-h-screen p-6">

    <section class="w-full max-w-4xl mx-auto space-y-8 text-center">

        <p class="text-purple-400 text-sm font-bold uppercase tracking-widest">

        <h1 class="text-5xl font-bold tracking-wide">

        <!-- Subtítulo -->

        <!-- Datos destacados -->

        </div>

        <!-- Enlace de inscripción -->

            <a href="#inscripcion"
               class="bg-purple-600 text-white px-8 py-4 font-bold text-lg uppercase tracking-wide">
